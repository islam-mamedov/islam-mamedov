<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title desc">
  <title id="title">Neural signal footer</title>
  <desc id="desc">A subtle animated cyan, blue, and purple neural waveform with the words perceive, reason, remember, and act.</desc>
  <defs>
    <linearGradient id="foot-bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080d14"/><stop offset="0.5" stop-color="#0b111b"/><stop offset="1" stop-color="#0e0c18"/></linearGradient>
    <linearGradient id="foot-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49e8ff" stop-opacity="0"/><stop offset="0.2" stop-color="#49e8ff"/><stop offset="0.7" stop-color="#6f7fff"/><stop offset="1" stop-color="#a875ff" stop-opacity="0"/></linearGradient>
    <filter id="foot-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="130" rx="22" fill="url(#foot-bg)" stroke="#252d41" stroke-width="2"/>
  <path d="M42 48h146l22-16 25 33 28-46 28 54 27-25h115l24-14 28 23 31-37 34 51 27-23h102l27-18 27 33 29-45 31 55 27-27h120" fill="none" stroke="#23384b" stroke-width="5" opacity="0.6"/>
  <path d="M42 48h146l22-16 25 33 28-46 28 54 27-25h115l24-14 28 23 31-37 34 51 27-23h102l27-18 27 33 29-45 31 55 27-27h120" fill="none" stroke="url(#foot-line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26 18" filter="url(#foot-glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle cx="42" cy="48" r="4" fill="#e5fdff" filter="url(#foot-glow)">
    <animate attributeName="cx" values="42;1158" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="103" text-anchor="middle" fill="#8195a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="5">PERCEIVE · REASON · REMEMBER · ACT</text>
</svg>
