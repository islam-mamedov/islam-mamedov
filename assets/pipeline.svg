<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Intelligence execution pipeline</title>
  <desc id="desc">A six-stage pipeline from input through perception, retrieval, reasoning, tool use, and verified output.</desc>
  <defs>
    <linearGradient id="pipe-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f17"/><stop offset="1" stop-color="#100d1c"/></linearGradient>
    <linearGradient id="pipe-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4ee8ff"/><stop offset="0.6" stop-color="#6d7fff"/><stop offset="1" stop-color="#a875ff"/></linearGradient>
    <pattern id="pipe-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#71cfe5" stroke-opacity="0.035"/></pattern>
    <filter id="pipe-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="248" rx="24" fill="url(#pipe-bg)" stroke="#2d344b" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="248" rx="24" fill="url(#pipe-grid)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="38" y="40" fill="#79e8ff" font-size="11" font-weight="700" letter-spacing="3">FUNCTION  /  INTELLIGENCE_PIPELINE()</text>
    <text x="1162" y="40" text-anchor="end" fill="#75899a" font-size="10" letter-spacing="1.8">INPUT → VERIFIED OUTPUT</text>
  </g>

  <path d="M127 128H1073" stroke="#27384c" stroke-width="3"/>
  <path d="M127 128H1073" stroke="url(#pipe-line)" stroke-width="2" stroke-dasharray="12 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <circle cx="127" cy="128" r="5" fill="#e8fdff" filter="url(#pipe-glow)">
    <animate attributeName="cx" values="127;1073" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(127 128)">
      <circle r="38" fill="#0d1a24" stroke="#38a9c1" stroke-width="2"/>
      <circle r="7" fill="#51e6ff" filter="url(#pipe-glow)"/>
      <text y="62" fill="#e2edf2" font-size="12" font-weight="700" letter-spacing="1.4">INPUT</text>
      <text y="80" fill="#708799" font-size="9" letter-spacing="1">SIGNAL</text>
    </g>
    <g transform="translate(316 128)">
      <circle r="38" fill="#0d1a24" stroke="#3f819e" stroke-width="2"/>
      <path d="M-16 0c9-13 23-13 32 0-9 13-23 13-32 0zm16-7a7 7 0 110 14 7 7 0 010-14z" fill="none" stroke="#56e7ff" stroke-width="2"/>
      <text y="62" fill="#e2edf2" font-size="12" font-weight="700" letter-spacing="1.2">PERCEPTION</text>
      <text y="80" fill="#708799" font-size="9" letter-spacing="1">VISION</text>
    </g>
    <g transform="translate(505 128)">
      <circle r="38" fill="#0e1725" stroke="#4c659d" stroke-width="2"/>
      <ellipse cy="-10" rx="17" ry="6" fill="none" stroke="#758cff" stroke-width="2"/>
      <path d="M-17-10v20c0 3 8 6 17 6s17-3 17-6v-20M-17 0c0 3 8 6 17 6s17-3 17-6" fill="none" stroke="#758cff" stroke-width="2"/>
      <text y="62" fill="#e2edf2" font-size="12" font-weight="700" letter-spacing="1.2">RETRIEVAL</text>
      <text y="80" fill="#708799" font-size="9" letter-spacing="1">MEMORY</text>
    </g>
    <g transform="translate(694 128)">
      <circle r="38" fill="#111527" stroke="#5c569d" stroke-width="2"/>
      <path d="M-17 6l12-18L5 5l12-17" fill="none" stroke="#9a7dff" stroke-width="2"/>
      <circle cx="-17" cy="6" r="3" fill="#65e6ff"/><circle cx="-5" cy="-12" r="3" fill="#798aff"/><circle cx="5" cy="5" r="3" fill="#8c7fff"/><circle cx="17" cy="-12" r="3" fill="#a875ff"/>
      <text y="62" fill="#e2edf2" font-size="12" font-weight="700" letter-spacing="1.2">REASONING</text>
      <text y="80" fill="#708799" font-size="9" letter-spacing="1">AGENT</text>
    </g>
    <g transform="translate(883 128)">
      <circle r="38" fill="#121426" stroke="#66519a" stroke-width="2"/>
      <path d="M-13-15h21l12 12-20 20-12-12L-1-6" fill="none" stroke="#a478ff" stroke-width="2"/>
      <text y="62" fill="#e2edf2" font-size="12" font-weight="700" letter-spacing="1.2">TOOL USE</text>
      <text y="80" fill="#708799" font-size="9" letter-spacing="1">ACTION</text>
    </g>
    <g transform="translate(1073 128)">
      <circle r="38" fill="#121426" stroke="#7551a2" stroke-width="2"/>
      <path d="M0-18l16 6v12c0 10-7 17-16 21C-9 17-16 10-16 0v-12z" fill="none" stroke="#ac7cff" stroke-width="2"/>
      <path d="M-7 0l5 5 10-11" fill="none" stroke="#58e7ff" stroke-width="2.5" stroke-linecap="round"/>
      <text y="62" fill="#e2edf2" font-size="12" font-weight="700" letter-spacing="1.2">OUTPUT</text>
      <text y="80" fill="#708799" font-size="9" letter-spacing="1">VERIFIED</text>
    </g>
  </g>
</svg>
