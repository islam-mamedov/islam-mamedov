<!-- ===================== ABOUT ME ======================== -->

## 👨‍💻 About Me

Hello! I'm **Islam Mamedov**, a software developer interested in building
useful, reliable, and thoughtfully designed digital products.

I enjoy transforming ideas into working applications, learning how systems
operate beneath the surface, and finding simple solutions to complex problems.

My main interests include:

- Software engineering
- Machine learning
- Artificial intelligence
- Web application development
- Mobile application development
- Backend systems and APIs
- Developer tools and automation
- Product design and user experience
- Open-source software
- Continuous learning

