<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Codebase Intelligence Agent</title>
  <desc id="desc">A graphite and blue project card showing a code graph and repository context.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101823"/>
      <stop offset="0.62" stop-color="#090f18"/>
      <stop offset="1" stop-color="#121229"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4be4ff"/>
      <stop offset="0.65" stop-color="#5d7cff"/>
      <stop offset="1" stop-color="#9b70ff"/>
    </linearGradient>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7d8cff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="758" height="318" rx="22" fill="url(#bg2)" stroke="#39496b" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="318" rx="22" fill="url(#grid2)"/>
  <circle cx="124" cy="154" r="150" fill="#4264ff" opacity="0.055"/>
  <path d="M22 52V24h28M710 24h28v28M22 268v28h28M738 268v28h-28" fill="none" stroke="#7189ff" stroke-opacity="0.5" stroke-width="2"/>

  <g transform="translate(38 50)">
    <rect width="238" height="220" rx="16" fill="#0b111b" stroke="#465a79"/>
    <path d="M0 34h238" stroke="#344761"/>
    <circle cx="18" cy="17" r="4" fill="#4ae6ff"/>
    <circle cx="32" cy="17" r="4" fill="#617dff"/>
    <circle cx="46" cy="17" r="4" fill="#9b70ff"/>
    <g fill="none" stroke-linecap="round">
      <path d="M30 66h36M30 90h55M30 114h44M30 138h66M30 162h48M30 186h58" stroke="#6b7f93" stroke-width="5" opacity="0.65"/>
      <path d="M127 68l25 30-14 35 31 31" stroke="#538bff" stroke-width="1.5"/>
      <path d="M127 68l48 6 21 36-27 54" stroke="#45ddfa" stroke-width="1.5"/>
      <path d="M152 98l44 12-2 65" stroke="#9178ff" stroke-width="1.5"/>
      <circle r="3" fill="#d6fbff" stroke="none" filter="url(#glow2)">
        <animateMotion path="M127 68l48 6 21 36-27 54" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#b5a8ff" stroke="none" filter="url(#glow2)">
        <animateMotion path="M152 98l44 12-2 65" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g filter="url(#glow2)">
      <circle cx="127" cy="68" r="6" fill="#45e5ff">
        <animate attributeName="r" values="5;8;5" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="152" cy="98" r="6" fill="#5a8cff"/>
      <circle cx="138" cy="133" r="6" fill="#7a7cff"/>
      <circle cx="169" cy="164" r="6" fill="#9b70ff"/>
      <circle cx="175" cy="74" r="6" fill="#5a8cff"/>
      <circle cx="196" cy="110" r="6" fill="#47c8ff">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="194" cy="175" r="6" fill="#8673ff"/>
    </g>
    <path d="M112 55l-16 0-12 15 12 15h16M210 55h16l12 15-12 15h-16" fill="none" stroke="#c5f5ff" stroke-width="2"/>
  </g>

  <g transform="translate(310 55)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="15" fill="#8798ff" font-size="11" font-weight="600" letter-spacing="3">PROJECT 02  /  AGENTIC RAG</text>
    <rect x="0" y="35" width="74" height="3" rx="1.5" fill="url(#line2)"/>
    <text x="0" y="82" fill="#e6edf3" font-size="31" font-weight="700" letter-spacing="1.4">CODEBASE</text>
    <text x="0" y="118" fill="#c4d0d9" font-size="26" font-weight="500" letter-spacing="1.8">INTELLIGENCE AGENT</text>
    <text x="0" y="153" fill="#8095a5" font-size="13" letter-spacing="0.4">Repository context, retrieval, and reasoning</text>
    <g transform="translate(0 184)" font-size="10" font-weight="600" letter-spacing="1.5">
      <rect width="82" height="28" rx="14" fill="#102430" stroke="#2c7e94"/>
      <text x="18" y="18" fill="#6de9ff">SEARCH</text>
      <rect x="94" width="92" height="28" rx="14" fill="#111f31" stroke="#365d9a"/>
      <text x="109" y="18" fill="#8db8ff">CONTEXT</text>
      <rect x="198" width="86" height="28" rx="14" fill="#19182f" stroke="#6651a1"/>
      <text x="215" y="18" fill="#b7a4ff">REASON</text>
    </g>
