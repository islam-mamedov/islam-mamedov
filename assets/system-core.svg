<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Intelligent system architecture</title>
  <desc id="desc">An animated architectural map connecting computer vision, agentic AI, retrieval memory, automation, and security to a central AI core.</desc>
  <defs>
    <linearGradient id="core-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b111a"/>
      <stop offset="0.5" stop-color="#070c13"/>
      <stop offset="1" stop-color="#100d1d"/>
    </linearGradient>
    <radialGradient id="core-halo">
      <stop stop-color="#4be7ff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#557fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#557fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core-line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4de8ff"/>
      <stop offset="0.55" stop-color="#6b7cff"/>
      <stop offset="1" stop-color="#a875ff"/>
    </linearGradient>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111d29"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
    <pattern id="core-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#65d8ef" stroke-opacity="0.04"/>
    </pattern>
    <filter id="core-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="518" rx="28" fill="url(#core-bg)" stroke="#25384d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="518" rx="28" fill="url(#core-grid)"/>
  <path d="M30 62V28h34M1136 28h34v34M30 458v34h34M1170 458v34h-34" fill="none" stroke="#54e4ff" stroke-opacity="0.45" stroke-width="2"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="42" y="48" fill="#7feaff" font-size="12" font-weight="700" letter-spacing="3.2">INTELLIGENT SYSTEM ARCHITECTURE</text>
    <text x="1158" y="48" text-anchor="end" fill="#6f8496" font-size="10" letter-spacing="2">LIVE TOPOLOGY  /  05 NODES</text>
  </g>

  <g fill="none" stroke="#36516a" stroke-width="2">
    <path d="M285 158C390 158 410 215 493 239"/>
    <path d="M915 158C810 158 790 215 707 239"/>
    <path d="M915 365C810 365 790 310 707 281"/>
    <path d="M285 365C390 365 410 310 493 281"/>
    <path d="M600 413V337"/>
  </g>
  <g fill="none" stroke="url(#core-line)" stroke-width="2" stroke-dasharray="8 12" opacity="0.8">
    <path d="M285 158C390 158 410 215 493 239"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/></path>
    <path d="M915 158C810 158 790 215 707 239"><animate attributeName="stroke-dashoffset" from="0" to="40" dur="3.4s" repeatCount="indefinite"/></path>
    <path d="M915 365C810 365 790 310 707 281"><animate attributeName="stroke-dashoffset" from="0" to="40" dur="3.2s" repeatCount="indefinite"/></path>
    <path d="M285 365C390 365 410 310 493 281"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3.6s" repeatCount="indefinite"/></path>
    <path d="M600 413V337"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.8s" repeatCount="indefinite"/></path>
  </g>

  <g filter="url(#core-glow)">
    <circle r="4" fill="#58e7ff"><animateMotion path="M285 158C390 158 410 215 493 239" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#7487ff"><animateMotion path="M915 158C810 158 790 215 707 239" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#a875ff"><animateMotion path="M915 365C810 365 790 310 707 281" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#58e7ff"><animateMotion path="M285 365C390 365 410 310 493 281" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#a875ff"><animateMotion path="M600 413V337" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="600" cy="260" r="154" fill="url(#core-halo)"/>
  <g fill="none" transform="rotate(-18 600 260)">
    <circle cx="600" cy="260" r="108" stroke="#243f55" stroke-width="2"/>
    <circle cx="600" cy="260" r="108" stroke="#4de8ff" stroke-width="3" stroke-dasharray="54 29 12 31" opacity="0.8" filter="url(#core-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 600 260" to="360 600 260" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="260" r="86" stroke="#6c7fff" stroke-width="2" stroke-dasharray="18 16" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 600 260" to="0 600 260" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="260" r="65" stroke="#9b73ff" stroke-width="2" stroke-dasharray="7 12" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="0 600 260" to="360 600 260" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="600" cy="260" r="48" fill="#0d1a25" stroke="url(#core-line)" stroke-width="2"/>
  <circle cx="600" cy="260" r="34" fill="#4de8ff" opacity="0.06">
    <animate attributeName="r" values="28;42;28" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0;0.15" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="254" fill="#eaf5fa" font-size="16" font-weight="700" letter-spacing="2.5">AI CORE</text>
    <text x="600" y="275" fill="#61e4ff" font-size="9" letter-spacing="2.4">PERCEIVE · REASON · ACT</text>
  </g>

  <g transform="translate(68 110)">
    <rect width="217" height="96" rx="16" fill="url(#panel-fill)" stroke="#2d6578"/>
    <path d="M18 39V20h19M66 20h19v19M18 57v19h19M85 57v19H66" fill="none" stroke="#51e5ff" stroke-width="2"/>
    <circle cx="52" cy="48" r="11" fill="none" stroke="#75ecff"/>
    <circle cx="52" cy="48" r="4" fill="#51e5ff" filter="url(#core-glow)">
      <animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="107" y="41" fill="#e4eef3" font-size="15" font-weight="700" letter-spacing="1.5">VISION</text>
      <text x="107" y="62" fill="#7890a2" font-size="10" letter-spacing="1">PERCEPTION</text>
    </g>
  </g>

  <g transform="translate(915 110)">
    <rect width="217" height="96" rx="16" fill="url(#panel-fill)" stroke="#3e5791"/>
    <g fill="none" stroke="#7188ff" stroke-width="1.5">
      <path d="M27 49l20-20 25 11 16 30M47 29l9 38M72 40L56 67M56 67l32 3"/>
    </g>
    <g fill="#8295ff" filter="url(#core-glow)">
      <circle cx="27" cy="49" r="4"/><circle cx="47" cy="29" r="4"/><circle cx="72" cy="40" r="4"/><circle cx="56" cy="67" r="4"/><circle cx="88" cy="70" r="4"/>
    </g>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="108" y="41" fill="#e4eef3" font-size="15" font-weight="700" letter-spacing="1.2">AGENTIC AI</text>
      <text x="108" y="62" fill="#7890a2" font-size="10" letter-spacing="1">REASONING</text>
    </g>
  </g>

  <g transform="translate(915 317)">
    <rect width="217" height="96" rx="16" fill="url(#panel-fill)" stroke="#58447e"/>
    <g fill="none" stroke="#a67aff" stroke-width="2">
      <ellipse cx="52" cy="29" rx="31" ry="10"/>
      <path d="M21 29v36c0 5 14 10 31 10s31-5 31-10V29M21 47c0 5 14 10 31 10s31-5 31-10"/>
    </g>
    <path d="M37 65h30" stroke="#55e6ff" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="108" y="41" fill="#e4eef3" font-size="15" font-weight="700" letter-spacing="1.2">RAG MEMORY</text>
      <text x="108" y="62" fill="#7890a2" font-size="10" letter-spacing="1">RETRIEVAL</text>
    </g>
  </g>

  <g transform="translate(68 317)">
    <rect width="217" height="96" rx="16" fill="url(#panel-fill)" stroke="#2c6078"/>
    <path d="M26 27h35l20 20-34 34-20-20 19-19" fill="none" stroke="#52e5ff" stroke-width="2"/>
    <circle cx="57" cy="51" r="10" fill="none" stroke="#7288ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 57 51" to="360 57 51" dur="5s" repeatCount="indefinite"/>
    </circle>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="107" y="41" fill="#e4eef3" font-size="15" font-weight="700" letter-spacing="1.2">TOOL USE</text>
      <text x="107" y="62" fill="#7890a2" font-size="10" letter-spacing="1">AUTOMATION</text>
    </g>
  </g>

  <g transform="translate(492 413)">
    <rect width="216" height="76" rx="16" fill="url(#panel-fill)" stroke="#5a4583"/>
    <path d="M28 16l23 9v17c0 13-10 22-23 27C15 64 5 55 5 42V25z" transform="translate(20 -4)" fill="none" stroke="#a979ff" stroke-width="2"/>
    <path d="M40 37l7 7 13-15" fill="none" stroke="#58e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="100" y="33" fill="#e4eef3" font-size="15" font-weight="700" letter-spacing="1.4">SECURITY</text>
      <text x="100" y="53" fill="#7890a2" font-size="10" letter-spacing="1">VERIFICATION</text>
    </g>
  </g>
</svg>
